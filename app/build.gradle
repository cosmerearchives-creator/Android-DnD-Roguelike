plugins { id 'com.android.application' }
def releaseVersion = new Properties()
rootProject.file('version.properties').withInputStream { releaseVersion.load(it) }
android {
    namespace 'com.cosmerearchives.dndroguelike'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cosmerearchives.dndroguelike'
        minSdk 26
        targetSdk 35
        versionCode releaseVersion.getProperty('versionCode').toInteger()
        versionName releaseVersion.getProperty('versionName')
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def keyPath = System.getenv('SIGNING_KEYSTORE_PATH')
            if (keyPath) {
                def keyPasswordValue = 'android-dnd-roguelike'
                def keyStore = java.security.KeyStore.getInstance('PKCS12')
                file(keyPath).withInputStream { keyStore.load(it, keyPasswordValue.toCharArray()) }
                storeFile file(keyPath)
                storePassword keyPasswordValue
                storeType 'PKCS12'
                keyAlias keyStore.aliases().nextElement()
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.core:core:1.15.0' }
