name: Tawny Bob refined rear trim (temporary)
on:
  push:
    branches: [art/bob-rear-trim-work]
    paths:
      - '.github/workflows/bob-arm-inspect.yml'
permissions:
  contents: write
jobs:
  retouch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow numpy scipy opencv-python-headless
      - name: Restore original current main artwork without touching rig
        run: |
          git fetch origin main
          git show FETCH_HEAD:app/src/main/assets/elf_roster/bob/2.webp > /tmp/bob-rear-original.webp
      - name: Inpaint two specific shoulder gold bands and verify
        run: |
          python scripts/refine-bob-rear-art.py
          cp build/bob-rear-refined/2.webp app/src/main/assets/elf_roster/bob/2.webp
      - name: Commit candidate binary and before-after crops (branch only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/elf_roster/bob/2.webp .art-review/
          git commit -m "Refine Tawny Bob rear shoulder trim (candidate) [skip ci]"
          git push origin HEAD:art/bob-rear-trim-work
