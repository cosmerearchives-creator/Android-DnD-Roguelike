name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify illustrated sprite atlas
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          path = 'app/src/main/assets/elf_fighter_atlas.webp'
          with Image.open(path) as art:
              assert art.size == (1440, 480), f'Unexpected sprite atlas size: {art.size}'
              assert art.mode == 'RGBA', f'No transparency channel: {art.mode}'
              art.load()
              for index in range(4):
                  frame = art.crop((index * 360, 0, (index + 1) * 360, 480))
                  assert frame.getchannel('A').getbbox(), f'Empty facing frame: {index}'
              print('Illustrated sprite atlas decoded successfully: 4 directions at 360x480.')
          walk_path = 'app/src/main/assets/elf_fighter_walk.webp'
          with Image.open(walk_path) as walk:
              assert walk.size == (2880, 1920), f'Unexpected walking atlas size: {walk.size}'
              assert walk.mode == 'RGBA', f'No transparency in walk atlas: {walk.mode}'
              walk.load()
              for direction in range(4):
                  for frame_idx in range(8):
                      frame = walk.crop((frame_idx * 360, direction * 480, (frame_idx + 1) * 360, (direction + 1) * 480))
                      assert frame.getchannel('A').getbbox(), f'Empty walking frame {direction}:{frame_idx}'
              print('Directional walking atlas validated: 4 directions x 8 frames.')
          with Image.open('app/src/main/assets/wildlands_terrain_v031.png') as terrain:
              assert terrain.size == (1254, 1254), f'Illustrated tile atlas dimensions: {terrain.size}'
              terrain.load()
              tile = terrain.width // 4
              for y in range(4):
                  for x in range(4):
                      part = terrain.crop((x*tile,y*tile,(x+1)*tile,(y+1)*tile))
                      assert part.getbbox(), f'Empty terrain art at {x},{y}'
              print('16 high-detail painted terrain materials validated.')
          with Image.open('app/src/main/assets/wildlands_vegetation.webp') as props:
              assert props.size == (1024, 256), f'Illustrated prop atlas dimensions: {props.size}'
              assert props.mode == 'RGBA', f'Vegetation transparency missing: {props.mode}'
              for index in range(4):
                  crop = props.crop((index*256,0,(index+1)*256,256))
                  assert crop.getchannel('A').getbbox(), f'Empty illustrated vegetation {index}'
              print('4 painted vegetation and rock props validated.')


          PY
      - name: Verify articulated gait math
        run: |
          mkdir -p "$RUNNER_TEMP/gait-tests"
          javac -d "$RUNNER_TEMP/gait-tests" \
            app/src/main/java/com/cosmerearchives/dndroguelike/GaitModel.java \
            app/src/main/java/com/cosmerearchives/dndroguelike/RigLegPose.java \
            tests/com/cosmerearchives/dndroguelike/GaitModelTest.java \
            tests/com/cosmerearchives/dndroguelike/RigLegPoseTest.java
          java -cp "$RUNNER_TEMP/gait-tests" com.cosmerearchives.dndroguelike.GaitModelTest
          java -cp "$RUNNER_TEMP/gait-tests" com.cosmerearchives.dndroguelike.RigLegPoseTest
      - name: Build and lint
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-checks
          path: app/build/reports/
          if-no-files-found: ignore
      - name: Detect intentional release
        id: release_gate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Build every change, but only publish when the version was explicitly bumped.
          # Manual runs are allowed for a missed release; the tag guard still prevents duplicates.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE_SHA" ] && git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- version.properties | grep -qx version.properties; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare signing
        if: steps.release_gate.outputs.publish == 'true'
        id: signing
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Add SIGNING_KEYSTORE_BASE64 to repository Actions secrets, then run this workflow again. Release skipped to preserve signing identity."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build signed APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK and prepare update
        if: steps.signing.outputs.ready == 'true'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          python3 scripts/prepare-release.py
      - name: Publish stable release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '\r')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping publication."
            exit 0
          fi
          gh release create "$TAG" dist/Android-DnD-Roguelike.apk dist/update.json --target "$GITHUB_SHA" --title "Android DnD Roguelike $TAG" --notes "Android starter with automatic update checks. Install the APK below. Android will ask you to approve installation." --latest
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
