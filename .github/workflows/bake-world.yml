name: Bake Blender World Assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'blender/create_character.py'
      - '.github/workflows/bake-world.yml'
concurrency:
  group: blender-world-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check whether main already includes this bake
        id: bake
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! sha256sum -c <(
            printf '%s  blender/create_character.py\n' "$(cat app/src/main/assets/blender_world/character_source.sha256)"
          ); then
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Blender and Pillow
        if: steps.bake.outputs.required == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1 libgl1-mesa-dri xvfb
          python3 -m pip install --quiet --break-system-packages Pillow
      - name: Bake Free Roam characters
        if: steps.bake.outputs.required == 'true'
        run: |
          xvfb-run -a blender --background --threads 4 --python blender/create_character.py -- --variant petite_pale --output build/character/petite
          xvfb-run -a blender --background --threads 4 --python blender/create_character.py -- --variant classic_study --output build/character/classic
          xvfb-run -a blender --background --threads 4 --python blender/create_character.py -- --variant petite_male --output build/character/petite_male
          xvfb-run -a blender --background --threads 4 --python blender/create_character.py -- --variant classic_male --output build/character/classic_male
          xvfb-run -a blender --background --threads 4 --python blender/create_character.py -- --variant dagger_goblin --output build/character/goblin
      - name: Assemble and verify new character atlas
        if: steps.bake.outputs.required == 'true'
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          target=Path('app/src/main/assets/blender_world')
          target.mkdir(parents=True,exist_ok=True)
          frame_maps={'idle':[0,0,0,0],
                      'walk':[0,1,2,3,4,5,6,7],
                      'punch':[0,1,2,3,4]}
          for style in ('petite','classic','petite_male','classic_male','goblin'):
           for motion, frame_map in frame_maps.items():
              sheet=Image.new('RGBA',(len(frame_map)*168,8*192))
              for facing in range(8):
                  for frame,source_frame in enumerate(frame_map):
                      with Image.open(f'build/character/{style}/{motion}_f{facing}_{source_frame}.png') as rendered:
                          image=rendered.convert('RGBA')
                          assert image.getchannel('A').getbbox(),(motion,facing,frame)
                          sheet.paste(image,(frame*168,facing*192))
              sheet.save(target/f'{style}_{motion}.png')
          import hashlib
          digest=hashlib.sha256(Path('blender/create_character.py').read_bytes()).hexdigest()
          (target/'character_source.sha256').write_text(digest+'\n')
          for p in target.glob('*.png'):
              print('BLENDER_ASSET_VERIFIED',p,p.stat().st_size)
          PY
      - name: Commit generated atlases against latest main without binary rebase
        if: steps.bake.outputs.required == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/baked-world
          cp app/src/main/assets/blender_world/petite_*.png /tmp/baked-world/
          cp app/src/main/assets/blender_world/classic_*.png /tmp/baked-world/
          cp app/src/main/assets/blender_world/goblin_*.png /tmp/baked-world/
          cp app/src/main/assets/blender_world/petite_male_*.png /tmp/baked-world/
          cp app/src/main/assets/blender_world/classic_male_*.png /tmp/baked-world/
          cp app/src/main/assets/blender_world/character_source.sha256 /tmp/baked-world/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            current=$(sha256sum blender/create_character.py | cut -d' ' -f1)
            baked=$(cat /tmp/baked-world/character_source.sha256)
            if [ "$current" != "$baked" ]; then
              echo "::error::Character generator changed while rendering; a fresh bake is required"
              exit 1
            fi
            cp /tmp/baked-world/petite_*.png app/src/main/assets/blender_world/
            cp /tmp/baked-world/classic_*.png app/src/main/assets/blender_world/
            cp /tmp/baked-world/goblin_*.png app/src/main/assets/blender_world/
            cp /tmp/baked-world/petite_male_*.png app/src/main/assets/blender_world/
            cp /tmp/baked-world/classic_male_*.png app/src/main/assets/blender_world/
            cp /tmp/baked-world/character_source.sha256 app/src/main/assets/blender_world/
            if grep -q '^versionName=0.3.83$' version.properties; then
              sed -i 's/^versionCode=104$/versionCode=105/;s/^versionName=0.3.83$/versionName=0.3.84/' version.properties
            fi
            git add app/src/main/assets/blender_world/ version.properties
            if git diff --cached --quiet; then
              echo "Atlases already current"
              break
            fi
            git commit -m "Bake redesigned Classic and Petite character atlases"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Upload source and rendered assets
        if: steps.bake.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blender-world-source-and-atlases
          path: |
            build/character/petite/petite_pale.blend
            build/character/classic/classic_study.blend
            build/character/goblin/dagger_goblin.blend
            build/character/petite_male/petite_male.blend
            build/character/classic_male/classic_male.blend
            app/src/main/assets/blender_world/
          retention-days: 30
