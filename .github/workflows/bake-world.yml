name: Bake Blender World Assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'blender/**'
      - '.github/workflows/bake-world.yml'
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1 libgl1-mesa-dri xvfb
          python3 -m pip install --quiet --break-system-packages Pillow
      - name: Bake improved Petite Pale character
        run: |
          xvfb-run -a blender --background --threads 4 --python blender/create_character.py -- --output build/character
      - name: Assemble and verify new character atlas
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          target=Path('app/src/main/assets/blender_world')
          target.mkdir(parents=True,exist_ok=True)
          from PIL import ImageOps
          frame_maps={'idle':[0,0,0,0],
                      'walk':[0,1,2,3,2,1,0,1],
                      'punch':[0,1,2,1,0]}
          for motion, frame_map in frame_maps.items():
              sheet=Image.new('RGBA',(len(frame_map)*168,8*192))
              for facing in range(8):
                  source_facing=facing if facing<=4 else 8-facing
                  for frame,source_frame in enumerate(frame_map):
                      with Image.open(f'build/character/{motion}_f{source_facing}_{source_frame}.png') as rendered:
                          image=rendered.convert('RGBA')
                          if facing>4: image=ImageOps.mirror(image)
                          assert image.getchannel('A').getbbox(),(motion,facing,frame)
                          sheet.paste(image,(frame*168,facing*192))
              sheet.save(target/f'petite_{motion}.png')
          for p in target.glob('*.png'):
              print('BLENDER_ASSET_VERIFIED',p,p.stat().st_size)
          PY
      - name: Commit rendered assets to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/blender_world/
          if ! git diff --cached --quiet; then
            git commit -m "Bake real Blender world and Petite Pale atlases"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload source and rendered assets
        uses: actions/upload-artifact@v4
        with:
          name: blender-world-source-and-atlases
          path: |
            build/character/petite_pale_elf.blend
            app/src/main/assets/blender_world/
          retention-days: 30
