name: Bake Blender World Assets
on:
  workflow_dispatch:
  push:
    branches: [feature/baked-blender-world-integration]
    paths:
      - 'blender/**'
      - '.github/workflows/bake-world.yml'
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1 libgl1-mesa-dri xvfb
          python3 -m pip install --quiet --break-system-packages Pillow
      - name: Bake elf and environment
        run: |
          xvfb-run -a blender --background --threads 2 --python blender/create_character.py -- --output build/character
          xvfb-run -a blender --background --threads 2 --python blender/create_world.py -- --output build/world
      - name: Assemble and verify real Blender atlases
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          target=Path('app/src/main/assets/blender_world')
          target.mkdir(parents=True,exist_ok=True)
          char=Image.new('RGBA',(4*168,4*192))
          for f in range(4):
              for n in range(4):
                  with Image.open(f'build/character/idle_f{f}_{n}.png') as frame:
                      assert frame.getchannel('A').getbbox(),(f,n)
                      char.paste(frame,(n*168,f*192))
          char.save(target/'petite_idle.png')
          tiles=Image.new('RGBA',(4*256,4*256))
          for n in range(16):
              with Image.open(f'build/world/terrain_{n:02d}.png') as tile:
                  assert tile.getchannel('A').getbbox(),n
                  tiles.paste(tile,((n%4)*256,(n//4)*256))
          tiles.save(target/'terrain.png')
          props=Image.new('RGBA',(5*256,256))
          for n in range(5):
              with Image.open(f'build/world/prop_{n:02d}.png') as prop:
                  assert prop.getchannel('A').getbbox(),n
                  props.paste(prop,(n*256,0))
          props.save(target/'props.png')
          for p in target.glob('*.png'):
              print('BLENDER_ASSET_VERIFIED',p,p.stat().st_size)
          PY
      - name: Commit rendered assets to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/blender_world/
          if ! git diff --cached --quiet; then
            git commit -m "Bake real Blender world and Petite Pale atlases"
            git push origin HEAD:feature/baked-blender-world-integration
          fi
      - name: Upload source and rendered assets
        uses: actions/upload-artifact@v4
        with:
          name: blender-world-source-and-atlases
          path: |
            build/character/petite_pale_elf.blend
            app/src/main/assets/blender_world/
          retention-days: 30
