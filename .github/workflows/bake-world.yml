name: Bake Blender World Assets
on:
  workflow_dispatch:
  push:
    branches: [feature/knee-walk-joystick-punch-v0375]
    paths:
      - 'blender/**'
      - '.github/workflows/bake-world.yml'
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Blender and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1 libgl1-mesa-dri xvfb
          python3 -m pip install --quiet --break-system-packages Pillow
      - name: Bake improved Petite Pale character
        run: |
          xvfb-run -a blender --background --threads 2 --python blender/create_character.py -- --output build/character
      - name: Assemble and verify new character atlas
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          target=Path('app/src/main/assets/blender_world')
          target.mkdir(parents=True,exist_ok=True)
          for motion, frames in (('idle',4),('walk',8),('punch',5)):
              sheet=Image.new('RGBA',(frames*168,4*192))
              for facing in range(4):
                  for frame in range(frames):
                      with Image.open(f'build/character/{motion}_f{facing}_{frame}.png') as image:
                          assert image.getchannel('A').getbbox(),(motion,facing,frame)
                          sheet.paste(image,(frame*168,facing*192))
              sheet.save(target/f'petite_{motion}.png')
          for p in target.glob('*.png'):
              print('BLENDER_ASSET_VERIFIED',p,p.stat().st_size)
          PY
      - name: Commit rendered assets to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/blender_world/
          if ! git diff --cached --quiet; then
            git commit -m "Bake real Blender world and Petite Pale atlases"
            git pull --rebase origin feature/controls-forest-feminine-model
            git push origin HEAD:feature/controls-forest-feminine-model
          fi
      - name: Upload source and rendered assets
        uses: actions/upload-artifact@v4
        with:
          name: blender-world-source-and-atlases
          path: |
            build/character/petite_pale_elf.blend
            app/src/main/assets/blender_world/
          retention-days: 30
