name: Blender Petite Pale Elf
on:
  workflow_dispatch:
  push:
    branches: [feature/blender-character-pipeline]
    paths:
      - 'blender/**'
      - '.github/workflows/blender-character.yml'
  pull_request:
    paths:
      - 'blender/**'
      - '.github/workflows/blender-character.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1 libgl1-mesa-dri xvfb
          python3 -m pip install --quiet --break-system-packages Pillow
      - name: Render editable model and eight directional idle previews
        run: |
          blender --version
          xvfb-run -a blender --background --threads 2 --python blender/create_character.py -- --output build/blender-preview
      - name: Assemble and validate eight-direction idle atlas
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          out=Path('build/blender-preview')
          atlas=Image.new('RGBA',(168*4,192*2),(0,0,0,0))
          for facing in range(8):
              with Image.open(out/f'idle_f{facing}_0.png') as image:
                  assert image.size==(168,192)
                  assert image.getchannel('A').getbbox(), facing
                  atlas.paste(image.convert('RGBA'),(facing%4*168,facing//4*192))
          atlas.save(out/'idle_atlas.png')
          assert (out/'petite_pale_elf.blend').stat().st_size>1000
          print('Validated eight rendered idle frames and editable Blender project.')
          PY
      - name: Upload editable Blender model and render previews
        uses: actions/upload-artifact@v4
        with:
          name: blender-petite-pale-elf
          path: |
            build/blender-preview/petite_pale_elf.blend
            build/blender-preview/idle_atlas.png
            build/blender-preview/idle_f0_0.png
          retention-days: 30
