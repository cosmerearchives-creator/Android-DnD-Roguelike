name: Bob rear trim candidate
on:
  push:
    branches: [fix/bob-rear-gold-trim]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python scripts/preview-bob-rear-trim.py
      - uses: actions/upload-artifact@v4
        with:
          name: bob-rear-trim-before-after
          path: build/bob-rear-trim/
